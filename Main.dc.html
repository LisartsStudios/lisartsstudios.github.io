<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisarts Studios — Lisandro Martínez Mendoza</title>
<meta name="description" content="Lisandro Martínez Mendoza · Lisarts Studios — Animación 2D/3D, Motion Graphics, Edición de video, Visualizers e Ilustración.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#071F24}
a{color:#22C3D6}a:hover{color:#7FE3EE}
html{scroll-behavior:smooth}
@keyframes subir{from{transform:translateY(110%)}to{transform:none}}
.mask{display:block;overflow:hidden;padding-bottom:.06em}
.mask > span{display:inline-block;animation:subir .9s cubic-bezier(.7,0,.2,1) both;animation-delay:var(--d)}
@keyframes entrar{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.entra{animation:entrar .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes salto{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.22,.61,.36,1)}50%{transform:translateY(var(--alto,-130px));animation-timing-function:cubic-bezier(.55,0,.78,.39)}100%{transform:translateY(0)}}
@keyframes squash{0%,100%{transform:scale(1.28,.72)}7%,93%{transform:scale(.88,1.14)}20%,80%{transform:scale(1,1)}}
@keyframes sombra{0%,100%{transform:scale(1);opacity:.5;animation-timing-function:cubic-bezier(.22,.61,.36,1)}50%{transform:scale(.4);opacity:.15;animation-timing-function:cubic-bezier(.55,0,.78,.39)}}
.salto{animation:salto 1s infinite;will-change:transform}
.squash{display:block;width:100%;height:100%;border-radius:50%;background:inherit;transform-origin:50% 100%;animation:squash 1s linear infinite}
.sombra{animation:sombra 1s infinite}
@keyframes morph{0%,100%{border-radius:8px;transform:rotate(0);background:#FFD23F}33%{border-radius:50%;transform:rotate(120deg) scale(.85);background:#FF7A5C}66%{border-radius:50% 8px 50% 8px;transform:rotate(240deg) scale(1.1);background:#B79CFF}}
.morph{animation:morph 4s cubic-bezier(.7,0,.3,1) infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.gira{animation:gira 6s cubic-bezier(.7,0,.3,1) infinite}
@keyframes camino{from{offset-distance:0%}to{offset-distance:100%}}
.viaja{offset-path:path('M24,210 C70,40 190,30 230,150 S320,300 336,60');animation:camino 3.6s cubic-bezier(.7,0,.3,1) infinite alternate;offset-rotate:0deg}

@keyframes pulso{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(45deg) scale(1.25)}}
.kf{animation:pulso 1.6s ease-in-out infinite}
.tile{transition:transform .35s cubic-bezier(.3,1.5,.5,1),box-shadow .35s ease}
.tile:hover,.tile:focus-visible{transform:translateY(-8px);box-shadow:0 20px 40px rgba(0,0,0,.35)}
.tile:hover .ico,.tile:focus-visible .ico{transform:scale(1.15) rotate(-6deg)}
.tile:focus-visible{outline:3px solid #FFFFFF;outline-offset:4px}
.ico{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes corte{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.corte{animation:corte 1.8s cubic-bezier(.7,0,.3,1) infinite}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.eq{animation:eq .9s ease-in-out infinite;transform-origin:50% 100%}
@keyframes trazo{0%{stroke-dashoffset:220}55%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-220}}
.trazo{stroke-dasharray:220;animation:trazo 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{animation:spin 18s linear infinite}
@keyframes flota{0%,100%{translate:0 0}50%{translate:0 -10px}}
.flota{animation:flota 5s ease-in-out infinite}
@keyframes chip{0%,100%{translate:0 0;rotate:var(--r)}50%{translate:0 -8px;rotate:calc(var(--r) * -1)}}
.chip{animation:chip 4.4s ease-in-out infinite;animation-delay:calc(var(--i) * -0.7s)}
@keyframes llenar{from{width:0}}
.barra{animation:llenar 1.6s cubic-bezier(.7,0,.2,1) both;animation-delay:calc(var(--i) * 120ms)}
@keyframes palabras{0%,28%{transform:translateY(0)}33%,61%{transform:translateY(-1.1em)}66%,94%{transform:translateY(-2.2em)}100%{transform:translateY(-3.3em)}}
.slot{display:inline-block;height:1.1em;overflow:hidden;vertical-align:bottom}
.slot > span{display:flex;flex-direction:column;animation:palabras 6s cubic-bezier(.7,0,.3,1) infinite}
.slot > span > span{height:1.1em;line-height:1.1em}
.forma{transition:border-radius .5s cubic-bezier(.7,0,.3,1),transform .5s cubic-bezier(.3,1.6,.5,1)}
.contacto:hover .forma,.contacto:focus-visible .forma{border-radius:50% !important;transform:rotate(180deg) scale(1.1)}
.contacto{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.contacto:hover,.contacto:focus-visible{transform:translateY(-6px)}
@keyframes hoyLat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.4}}
.hoy-punto{animation:hoyLat 1.4s ease-in-out infinite}
@keyframes crece{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.capa{transform-origin:0 50%;animation:crece 1s cubic-bezier(.7,0,.2,1) both;animation-delay:calc(var(--i) * 140ms)}
@keyframes abrir{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.abre{animation:abrir .5s cubic-bezier(.2,1.1,.4,1) both}
.btn{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.btn:hover,.btn:focus-visible{transform:translateY(-3px)}
@keyframes trBall{0%{transform:translate(0,0)}14%{transform:translate(18vw,-42vh)}28%{transform:translate(36vw,0)}42%{transform:translate(50vw,-28vh)}56%{transform:translate(60vw,0)}100%{transform:translate(50vw,-30vh) scale(36)}}
@keyframes trSquash{0%,100%{transform:scale(1)}26%,30%{transform:scale(1.35,.7)}54%,58%{transform:scale(1.35,.7)}14%,42%{transform:scale(.9,1.12)}}
.tr-ball{animation:trBall 1.4s cubic-bezier(.5,0,.5,1) forwards}
.tr-squash{transform-origin:50% 100%;animation:trSquash 1.4s linear forwards}
@keyframes trLinea{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tr-linea{transform:scaleX(0);animation:trLinea .55s cubic-bezier(.7,0,.2,1) forwards}
@keyframes trTapa{from{opacity:0}to{opacity:1}}
.tr-tapa{opacity:0;animation:trTapa .25s ease forwards}
@keyframes trClip{from{transform:translateY(-105%)}to{transform:none}}
.tr-clip{transform:translateY(-105%);animation:trClip .45s cubic-bezier(.7,0,.2,1.2) forwards}
@keyframes trCab{from{left:-6px}to{left:100%}}
.tr-cabezal{left:-6px;animation:trCab .5s linear .5s forwards}
@keyframes trEq{0%{transform:scaleY(0)}55%{transform:scaleY(.95)}75%{transform:scaleY(.55)}100%{transform:scaleY(1)}}
.tr-eq{transform:scaleY(0);transform-origin:50% 100%;animation:trEq .8s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes trTrazo{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.tr-trazo{stroke-dasharray:1;stroke-dashoffset:1;animation:trTrazo 1s cubic-bezier(.6,0,.4,1) forwards}
@media (prefers-reduced-motion:reduce){.hoy-punto{animation:none}.mask > span,.entra,.salto,.squash,.sombra,.morph,.gira,.viaja,.kf,.corte,.eq,.trazo,.ring,.flota,.chip,.barra,.slot > span,.capa,.abre{animation:none}}
</style>

</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="font-family: Inter, system-ui, sans-serif; color: #E8F4F6; background: #071F24; min-height: 100vh; overflow-x: clip">

<div style="position: sticky; top: 0; z-index: 100; background: {{barraFondo}}; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid {{barraBorde}}; transition: background .3s ease, border-color .3s ease">
<header style="max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between">
<span style="font-family: Unbounded, sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 0.04em; color: #FFFFFF">LISARTS<span style="color: #FFD23F"> STUDIOS</span></span>
<nav aria-label="Principal" style="display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 15px">
<a href="#trabajos" style="color: #B9D6DB; text-decoration: none; padding: 0 12px; min-height: 44px; display: inline-flex; align-items: center">Trabajos</a>
<a href="#sobre-mi" style="color: #B9D6DB; text-decoration: none; padding: 0 12px; min-height: 44px; display: inline-flex; align-items: center">Sobre mí</a>
<a href="#contacto" class="btn" style="background: #FFD23F; color: #071F24; font-weight: 700; padding: 0 20px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 999px; text-decoration: none">Hablemos</a>
</nav>
</header>
</div>

<section aria-label="Mis trabajos de hoy" style="max-width: 1200px; margin: 0 auto; padding: 28px 24px 8px">
<div style="border-radius: 24px; background: #0B2E35; border: 1.5px solid #164650; padding: clamp(18px, 3vw, 28px); display: flex; flex-wrap: wrap; gap: 22px; align-items: center">
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #FFD23F; color: #071F24; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase"><span class="hoy-punto" style="width: 8px; height: 8px; border-radius: 50%; background: #FF7A5C"></span>Hoy · Food Delivery Day</span>
<h2 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.05; color: #FFFFFF">Mis trabajos de hoy:</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #B9D6DB">El video del tótem de Eco Bolsas que está en la expo y el teaser de un videoclip animado.</p>
</div>
<div style="flex: 0 0 auto; width: min(100%, 210px); margin: 0 auto; display: flex; flex-direction: column; gap: 8px">
<div style="border-radius: 16px; padding: 7px; background: #071F24; border: 1.5px solid #5EE6A8">
<video src="media/d56af9268009e2d1d4bc49164db33749.mp4" poster="media/85dbe7c2dfa1e1438897114c5b28d771.jpg" autoplay muted loop playsinline controls preload="metadata" style="width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 10px; display: block; background: #020B0D"></video>
</div>
<span style="font-weight: 700; font-size: 15px; color: #FFFFFF">Eco Bolsas</span>
<span style="font-size: 13px; color: #8FC3CB">Video para tótem · motion graphics</span>
</div>
<div style="flex: 2 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<div style="border-radius: 16px; padding: 7px; background: #071F24; border: 1.5px solid #FF7A5C">
<video src="media/b7921f337c177bc145f226bf6da77557.mp4" poster="media/b764ecd8b97fe369a40ab540e1592b5f.jpg" controls playsinline preload="none" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; background: #020B0D"></video>
</div>
<span style="font-weight: 700; font-size: 15px; color: #FFFFFF">Chiedo Solo a Dio — Teaser</span>
<span style="font-size: 13px; color: #8FC3CB">Videoclip animado de "Solo le pido a Dios" en italiano</span>
</div>
</div>
</section>
<section style="max-width: 1200px; margin: 0 auto; padding: 40px 24px 32px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<p class="entra" style="--d: 0s; margin: 0; display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #8FC3CB"><span class="kf" style="width: 10px; height: 10px; background: #FFD23F; transform: rotate(45deg)"></span>Animación · Motion Graphics · Edición</p>
<h1 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: clamp(40px, 6.6vw, 88px); line-height: 1.02; letter-spacing: -0.02em; color: #FFFFFF">
<span class="mask"><span style="--d: .1s">Lisandro</span></span>
<span class="mask"><span style="--d: .22s; color: #22C3D6">Martínez</span></span>
<span class="mask"><span style="--d: .34s">Mendoza</span></span>
</h1>
<p class="entra" style="--d: .6s; margin: 0; font-size: 19px; line-height: 1.55; color: #B9D6DB; max-width: 560px">Animador 2D/3D, motion designer y editor de video. Le doy movimiento a marcas, músicos e historias desde <b style="color: #FFFFFF">Lisarts Studios</b>.</p>
<div class="entra" style="--d: .75s; display: flex; flex-wrap: wrap; gap: 12px">
<a class="btn" href="#trabajos" style="background: #22C3D6; color: #071F24; font-weight: 700; padding: 0 24px; min-height: 52px; display: inline-flex; align-items: center; border-radius: 999px; text-decoration: none">Ver trabajos</a>
<a class="btn" href="https://wa.me/5491158165994" style="border: 2px solid #3E6E76; color: #FFFFFF; font-weight: 700; padding: 0 24px; min-height: 52px; display: inline-flex; align-items: center; border-radius: 999px; text-decoration: none">WhatsApp</a>
</div>
</div>
<div aria-hidden="true" style="flex: 1 1 340px; display: flex; justify-content: center">
<div style="position: relative; width: 360px; height: 320px; max-width: 100%">
<svg width="360" height="320" viewBox="0 0 360 320" style="position: absolute; inset: 0; overflow: visible"><path d="M24,210 C70,40 190,30 230,150 S320,300 336,60" fill="none" stroke="#3E6E76" stroke-width="2" stroke-dasharray="4 8"></path></svg>
<span class="viaja" style="position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 6px rgba(255,255,255,0.15)"></span>
<span class="morph" style="position: absolute; left: 34px; top: 34px; width: 78px; height: 78px"></span>
<svg class="gira" width="90" height="90" viewBox="0 0 90 90" style="position: absolute; right: 18px; top: 150px"><polygon points="45,8 84,78 6,78" fill="#5EE6A8"></polygon></svg>
<span class="sombra" style="position: absolute; left: 150px; bottom: 6px; width: 70px; height: 12px; border-radius: 50%; background: #000000"></span>
<span class="salto" style="position: absolute; left: 155px; bottom: 12px; width: 60px; height: 60px; --alto: -150px"><span class="squash" style="background: #22C3D6"></span></span>
</div>
</div>
</section>

<section aria-label="Graph editor interactivo" style="max-width: 1200px; margin: 0 auto; padding: 0 24px 24px">
<div style="border-radius: 20px; background: #0B2E35; padding: 20px 22px; display: flex; flex-wrap: wrap; gap: 22px; align-items: center">
<div style="flex: 1 1 200px; max-width: 240px; display: flex; flex-direction: column; gap: 10px">
<span style="font-weight: 700; color: #FFFFFF; font-size: 16px">Graph editor</span>
<span style="font-size: 13px; line-height: 1.4; color: #8FC3CB">Arrastrá las manijas amarillas y mirá cómo cambia el movimiento.</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="5"><button type="button" onClick="{{p.set}}" style="min-height: 34px; padding: 0 10px; border-radius: 999px; border: 1.5px solid {{p.borde}}; background: {{p.fondo}}; color: {{p.texto}}; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer">{{p.n}}</button></sc-for>
</div>
</div>
<div id="ge-box" style="position: relative; flex: 2 1 300px; max-width: 560px; aspect-ratio: 300 / 160; background-image: repeating-linear-gradient(90deg, #164650 0 1px, transparent 1px 10%), repeating-linear-gradient(0deg, #164650 0 1px, transparent 1px 12.5%); border-radius: 8px; touch-action: none">
<svg aria-hidden="true" viewBox="0 0 300 160" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible">
<line x1="0" y1="130" x2="300" y2="130" stroke="#3E6E76" stroke-width="1" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"></line>
<line x1="0" y1="30" x2="300" y2="30" stroke="#3E6E76" stroke-width="1" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"></line>
<line x1="0" y1="130" x2="{{g.x1}}" y2="{{g.y1}}" stroke="#FFD23F" stroke-width="1.5" vector-effect="non-scaling-stroke"></line>
<line x1="300" y1="30" x2="{{g.x2}}" y2="{{g.y2}}" stroke="#FFD23F" stroke-width="1.5" vector-effect="non-scaling-stroke"></line>
<path d="{{g.d}}" fill="none" stroke="#22C3D6" stroke-width="3" vector-effect="non-scaling-stroke"></path>
</svg>
<span aria-hidden="true" style="position: absolute; left: 0; top: 81.25%; width: 14px; height: 14px; margin: -7px; background: #FFFFFF; transform: rotate(45deg)"></span>
<span aria-hidden="true" style="position: absolute; left: 100%; top: 18.75%; width: 14px; height: 14px; margin: -7px; background: #FFFFFF; transform: rotate(45deg)"></span>
<span id="ge-tiempo" aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 0; width: 1px; background: rgba(255,122,92,0.6); pointer-events: none"></span>
<span id="ge-punto" aria-hidden="true" style="position: absolute; left: 0; top: 81.25%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #FF7A5C; box-shadow: 0 0 0 4px rgba(255,122,92,0.3); pointer-events: none"></span>
<button type="button" aria-label="Manija de salida" onPointerDown="{{agarrar1}}" style="position: absolute; left: {{g.l1}}; top: {{g.t1}}; width: 30px; height: 30px; margin: -15px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: grab; touch-action: none; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 50%; background: #FFD23F; box-shadow: 0 0 0 4px rgba(255,210,63,0.25)"></span></button>
<button type="button" aria-label="Manija de llegada" onPointerDown="{{agarrar2}}" style="position: absolute; left: {{g.l2}}; top: {{g.t2}}; width: 30px; height: 30px; margin: -15px; padding: 0; border: none; border-radius: 50%; background: transparent; cursor: grab; touch-action: none; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 50%; background: #FFD23F; box-shadow: 0 0 0 4px rgba(255,210,63,0.25)"></span></button>
</div>
<div aria-hidden="true" style="flex: 1 1 220px; position: relative; height: 60px; border-radius: 999px; background: #071F24">
<span id="ge-bola" style="position: absolute; top: 8px; left: 8px; width: 44px; height: 44px; border-radius: 50%; background: #FF7A5C"></span>
</div>
</div>
</section>

<section id="trabajos" style="max-width: 1200px; margin: 0 auto; padding: 72px 24px 96px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; align-items: flex-end">
<h2 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: clamp(32px, 5vw, 60px); line-height: 1.05; letter-spacing: -0.02em; color: #FFFFFF">¿Qué querés ver?</h2>
<p style="margin: 0; color: #8FC3CB; font-size: 16px">Cada sección tiene sus trabajos.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px">

<button type="button" class="tile" onClick="{{goAnim}}" style="all: unset; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 14px; padding: 26px; border-radius: 24px; background: #22C3D6; color: #071F24; text-decoration: none; min-height: 250px; box-sizing: border-box">
<span class="ico" aria-hidden="true" style="position: relative; width: 70px; height: 70px; border-radius: 18px; background: #071F24; display: block; overflow: hidden"><span class="salto" style="position: absolute; left: 23px; bottom: 8px; width: 24px; height: 24px; --alto: -30px"><span class="squash" style="background: #22C3D6"></span></span></span>
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em">01</span>
<span style="font-family: Unbounded, sans-serif; font-size: 24px; font-weight: 800; line-height: 1.1">Animación 2D/3D</span>
<span style="font-size: 15px; line-height: 1.45; flex-grow: 1">Cortos, secuencias animadas y dirección de animación.</span>
<span style="font-weight: 700">Entrar →</span>
</button>

<button type="button" class="tile" onClick="{{goMotion}}" style="all: unset; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 14px; padding: 26px; border-radius: 24px; background: #FFD23F; color: #071F24; text-decoration: none; min-height: 250px; box-sizing: border-box">
<span class="ico" aria-hidden="true" style="width: 70px; height: 70px; border-radius: 18px; background: #071F24; display: flex; align-items: center; justify-content: center"><span class="morph" style="width: 30px; height: 30px"></span></span>
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em">02</span>
<span style="font-family: Unbounded, sans-serif; font-size: 24px; font-weight: 800; line-height: 1.1">Motion Graphics</span>
<span style="font-size: 15px; line-height: 1.45; flex-grow: 1">Piezas animadas para marcas, redes y publicidad.</span>
<span style="font-weight: 700">Entrar →</span>
