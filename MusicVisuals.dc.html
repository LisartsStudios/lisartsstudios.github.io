<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisarts Studios — Visualizers Musicales</title>
<meta name="description" content="Lisandro Martínez Mendoza · Lisarts Studios — Animación 2D/3D, Motion Graphics, Edición de video, Visualizers e Ilustración.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#071F24}
a{color:#B79CFF}a:hover{color:#D3C4FF}
html{scroll-behavior:smooth}
@keyframes entrar{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.entra{animation:entrar .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes baila{0%,100%{transform:translateY(0) scaleY(1)}20%{transform:translateY(-.1em) scaleY(1.06)}40%{transform:translateY(0) scaleY(.94)}}
@keyframes cae{from{opacity:0;transform:translateY(-.6em)}to{opacity:1;transform:none}}
.nota{display:inline-block;transform-origin:50% 100%;animation:cae .5s cubic-bezier(.3,1.6,.5,1) both,baila var(--b) ease-in-out infinite;animation-delay:calc(var(--i) * 45ms),calc(var(--i) * 45ms + .6s)}
@keyframes gira{to{transform:rotate(360deg)}}
.gira{animation:gira var(--v, 1.8s) linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.gira.quieto{animation-play-state:paused}
@keyframes brazo{0%{transform:rotate(-28deg)}60%{transform:rotate(4deg)}75%{transform:rotate(1deg)}100%{transform:rotate(2deg)}}
.brazo{transform-box:view-box;transform-origin:262px 46px;animation:brazo 1.6s cubic-bezier(.5,0,.2,1) .5s both}
@keyframes onda{from{transform:scale(.6);opacity:.8}to{transform:scale(1.5);opacity:0}}
.onda{transform-box:fill-box;transform-origin:50% 50%;animation:onda 2.4s ease-out infinite;animation-delay:var(--d)}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.eq{transform-origin:50% 100%;animation:eq var(--t) ease-in-out infinite;animation-delay:var(--d)}
.eq.quieto{animation:none;transform:scaleY(.2)}
.btn{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.btn:hover,.btn:focus-visible{transform:translateY(-3px) rotate(-1.5deg)}
.funda{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:10px;width:100%}
.funda:focus-visible{outline:3px solid #FFFFFF;outline-offset:6px;border-radius:12px}
.funda .tapa{position:relative;z-index:2;display:block;aspect-ratio:1 / 1;border-radius:10px;overflow:hidden;background:#0B2E35;box-shadow:0 14px 28px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.funda .tapa img{width:100%;height:100%;object-fit:cover;display:block}
.funda .disco{position:absolute;z-index:1;top:4%;left:4%;width:92%;aspect-ratio:1 / 1;border-radius:50%;background:repeating-radial-gradient(circle,#0A0A0C 0 2px,#1B1B20 2px 4px);transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.funda .disco::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--c)}
.funda:hover .tapa,.funda:focus-visible .tapa{transform:translateY(-8px) rotate(-2deg)}
.funda:hover .disco,.funda:focus-visible .disco{transform:translateX(26%)}
.funda[aria-pressed="true"] .disco{transform:translateX(34%);animation:gira 1.8s linear infinite}
.funda[aria-pressed="true"] .tapa{box-shadow:0 0 0 3px var(--c),0 14px 28px rgba(0,0,0,.35)}
@keyframes sello{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(-8deg) scale(1.06)}}
.sello{animation:sello 2.4s ease-in-out infinite}
@keyframes vinilo{from{clip-path:circle(150% at 50% 50%)}to{clip-path:circle(0% at 50% 50%)}}
.cortina{animation:vinilo .9s cubic-bezier(.7,0,.2,1) .15s both}
@media (prefers-reduced-motion:reduce){.entra,.nota,.gira,.brazo,.onda,.eq,.sello,.funda[aria-pressed="true"] .disco{animation:none}.cortina{display:none}.funda .tapa,.funda .disco,.btn{transition:none}}
</style>

</head>
<body>

</header>
</div>

<section style="max-width: 1200px; margin: 0 auto; padding: 44px 24px 28px; display: flex; flex-wrap: wrap; gap: 36px; align-items: center">

<span aria-hidden="true" style="display: block; white-space: nowrap"><sc-for list="{{t1}}" as="l" hint-placeholder-count="11"><span class="nota" style="--i: {{l.i}}; --b: {{l.b}}">{{l.c}}</span></sc-for></span>

</div>
<div aria-hidden="true" style="flex: 1 1 280px; display: flex; justify-content: center">

<section aria-label="Bandeja" style="max-width: 1200px; margin: 0 auto; padding: 28px 24px 16px; display: flex; flex-direction: column; gap: 18px">

</button>

<div style="flex: 1 1 280px; min-width: 0; border-radius: 18px; background: #0B2E35; border: 1.5px solid #164650; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
