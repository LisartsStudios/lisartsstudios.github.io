<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisarts Studios — Visualizers Musicales</title>
<meta name="description" content="Lisandro Martínez Mendoza · Lisarts Studios — Animación 2D/3D, Motion Graphics, Edición de video, Visualizers e Ilustración.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#071F24}
a{color:#22C3D6}a:hover{color:#7FE3EE}
html{scroll-behavior:smooth}
@keyframes letra{from{opacity:0;transform:translateY(.5em) rotate(10deg)}to{opacity:1;transform:none}}
@keyframes salta{0%,100%{transform:translateY(0)}50%{transform:translateY(-.08em)}}
.l{display:inline-block;animation:letra .7s cubic-bezier(.2,.9,.3,1.3) both,salta 2.6s ease-in-out infinite;animation-delay:calc(var(--i) * 55ms),calc(var(--i) * 120ms + .8s);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.l:hover{transform:translateY(-14px) rotate(-8deg)}
@keyframes salto{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.22,.61,.36,1)}50%{transform:translateY(-150px);animation-timing-function:cubic-bezier(.55,0,.78,.39)}100%{transform:translateY(0)}}
@keyframes squash{0%,100%{transform:scale(1.28,.72)}7%,93%{transform:scale(.88,1.14)}20%,80%{transform:scale(1,1)}}
@keyframes sombra{0%,100%{transform:scale(1);opacity:.45;animation-timing-function:cubic-bezier(.22,.61,.36,1)}50%{transform:scale(.4);opacity:.15;animation-timing-function:cubic-bezier(.55,0,.78,.39)}}
.pelota{animation:salto 1s infinite}
.squash{display:block;width:100%;height:100%;border-radius:50%;transform-origin:50% 100%;animation:squash 1s linear infinite}
.sombra{animation:sombra 1s infinite}
@keyframes revela{from{clip-path:circle(150% at 50% 50%)}to{clip-path:circle(0% at 50% 50%)}}
.revela{animation:revela .8s cubic-bezier(.7,0,.2,1) .1s both}
@keyframes cinta{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.cinta{animation:cinta 34s linear infinite}
.tira:hover .cinta,.tira:focus-within .cinta{animation-play-state:paused}
.cuadro{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.cuadro:hover,.cuadro:focus-visible{transform:scale(1.06) rotate(-1.5deg)}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.play{animation:pulso 1.8s ease-in-out infinite}
@keyframes flota{0%,100%{translate:0 0;rotate:-6deg}50%{translate:0 -10px;rotate:4deg}}
.sticker{animation:flota 4.2s ease-in-out infinite}
.sticker.s2{animation-delay:-1.4s;animation-duration:5s}.sticker.s3{animation-delay:-2.6s}
@keyframes bota{0%,100%{translate:0 0}45%{translate:0 -8px}60%{translate:0 -5px}}
.bota{animation:bota 3.2s ease-in-out infinite}
.bota:nth-child(2n){animation-delay:-.8s}.bota:nth-child(3n){animation-delay:-1.7s}
@keyframes escribir{0%{clip-path:inset(-20% 100% -20% 0)}50%,85%{clip-path:inset(-20% 0 -20% 0);opacity:1}95%{opacity:0}100%{clip-path:inset(-20% 100% -20% 0);opacity:0}}
.escribe{display:inline-block;animation:escribir 5s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes abrir{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
.abre{animation:abrir .45s cubic-bezier(.2,1.2,.4,1) both}
.btn{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.btn:hover,.btn:focus-visible{transform:translateY(-3px) rotate(-1.5deg)}
@media (prefers-reduced-motion:reduce){.l,.pelota,.squash,.sombra,.cinta,.play,.sticker,.bota,.escribe,.abre{animation:none}.tira{overflow-x:auto}.revela{display:none}}
</style>

</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="font-family: Inter, system-ui, sans-serif; color: #E8F4F6; background: #071F24; min-height: 100vh; overflow-x: clip">

<div style="position: sticky; top: 0; z-index: 100; background: {{barraFondo}}; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid {{barraBorde}}; transition: background .3s ease, border-color .3s ease">
<header style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between">
<a href="Main.dc.html" class="btn" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #E8F4F6; color: #071F24; text-decoration: none; font-weight: 600; font-size: 14px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Volver a las secciones</a>
<nav aria-label="Secciones" style="display: flex; flex-wrap: wrap; gap: 4px; font-size: 14px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
<a href="{{t.href}}" style="{{t.estilo}}">{{t.label}}</a>
</sc-for>
</nav>
</header>
</div>

<section style="max-width: 1200px; margin: 0 auto; padding: 36px 24px 24px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; justify-content: space-between">
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #8FC3CB">Sección {{num}} / 05</p>
<h1 aria-label="{{titulo}}" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(48px, 8vw, 112px); line-height: 0.95; letter-spacing: -0.03em; color: #FFFFFF"><sc-for list="{{letras}}" as="l" hint-placeholder-count="10"><span class="l" aria-hidden="true" style="--i: {{l.i}}; color: {{l.color}}">{{l.c}}</span></sc-for></h1>
<p style="margin: 0; font-family: Caveat, cursive; font-size: 30px; color: {{accent}}; transform: rotate(-2deg); align-self: flex-start">{{bajada}}</p>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #B9D6DB; max-width: 620px">{{desc}}</p>
</div>
<div aria-hidden="true" style="flex: 1 1 260px; display: flex; justify-content: center; position: relative; height: 240px">
<div style="position: absolute; bottom: 20px; width: 220px; height: 3px; border-radius: 3px; background: #164650"></div>
<div class="sombra" style="position: absolute; bottom: 14px; width: 80px; height: 14px; border-radius: 50%; background: #000000"></div>
<div class="pelota" style="position: absolute; bottom: 22px; width: 70px; height: 70px"><span class="squash" style="background: {{accent}}"></span></div>
<span style="position: absolute; top: 0; right: 0; font-family: Caveat, cursive; font-size: 20px; color: #8FC3CB; transform: rotate(6deg)">squash &amp; stretch ✶</span>
</div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 8px 24px 24px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="4"><span class="bota" style="padding: 9px 16px; border-radius: 999px; border: 1.5px solid #3E6E76; font-size: 14px; font-weight: 500">{{t}}</span></sc-for>
</div>
</section>

<section aria-label="Trabajos" style="position: relative; padding: 56px 0 40px; display: flex; flex-direction: column; gap: 22px">
<div style="max-width: 1200px; width: 100%; margin: 0 auto; padding: 0 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(34px, 5vw, 60px); line-height: 1; letter-spacing: -0.02em; color: #FFFFFF">Trabajos</h2>
<p style="margin: 0; font-family: Caveat, cursive; font-size: 24px; color: {{accent}}; transform: rotate(-2deg)">tocá un cuadro para verlo ↓</p>
</div>
<sc-for list="{{stickers}}" as="k" hint-placeholder-count="2">
<div class="sticker {{k.cls}}" aria-hidden="true" style="position: absolute; z-index: 5; pointer-events: none; {{k.pos}}; width: 128px; height: 128px; border-radius: 50%; background: {{k.bg}}; color: #071F24; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 14px 30px rgba(0,0,0,0.35)"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; line-height: 1">{{k.big}}</span><span style="font-size: 12px; max-width: 80%; line-height: 1.2">{{k.small}}</span></div>
</sc-for>
<div class="tira" style="background: #020B0D; padding: 22px 0; position: relative">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 6px; height: 10px; background-image: repeating-linear-gradient(90deg, #2A4A50 0 14px, transparent 14px 30px)"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 6px; height: 10px; background-image: repeating-linear-gradient(90deg, #2A4A50 0 14px, transparent 14px 30px)"></div>
<div class="cinta" style="display: flex; gap: 14px; width: max-content; padding: 0 7px; align-items: center">
<sc-for list="{{cuadros}}" as="f" hint-placeholder-count="8">
<button type="button" class="cuadro" onClick="{{f.abrir}}" tabindex="{{f.tab}}" aria-hidden="{{f.oculto}}" aria-label="Ver {{f.titulo}}" style="all: unset; cursor: pointer; flex: none; width: {{frameW}}; display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 10px; background: #0B2E35; box-sizing: border-box">
<span style="position: relative; aspect-ratio: {{ratio}}; border-radius: 6px; background: {{f.fondo}}; display: flex; align-items: center; justify-content: center; overflow: hidden">
<span style="position: absolute; left: 8px; top: 8px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.1em; color: #071F24; background: rgba(232,244,246,0.85); padding: 2px 8px; border-radius: 999px">{{f.tag}}</span>
<span class="play" style="width: 52px; height: 52px; border-radius: 50%; background: #071F24; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="{{accent}}"><path d="M8 5v14l11-7z"></path></svg></span>
</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: #FFFFFF; padding: 0 4px">{{f.titulo}}</span>
</button>
</sc-for>
</div>
</div>
<p style="max-width: 1200px; width: 100%; margin: 0 auto; padding: 0 24px; box-sizing: border-box; font-size: 13px; color: #8FC3CB">La cinta se frena cuando pasás el mouse por encima.</p>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 40px 24px; display: flex; flex-direction: column; gap: 20px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 44px); color: #FFFFFF">Qué puedo hacer por vos</h2>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<sc-for list="{{servicios}}" as="x" hint-placeholder-count="4">
<span class="bota" style="display: inline-flex; align-items: center; gap: 10px; padding: 16px 22px; border-radius: 18px; background: #0B2E35; font-size: 17px; font-weight: 500"><span style="width: 12px; height: 12px; border-radius: 50%; background: {{accent}}"></span>{{x}}</span>
</sc-for>
</div>
</section>

<section style="padding: 32px 24px 64px">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; background: {{accent}}; color: #071F24; border-radius: 28px; padding: clamp(28px, 4vw, 52px); display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between">
<div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 3.6vw, 42px); line-height: 1.05">{{cta}}</h2>
<p style="margin: 0; font-family: Caveat, cursive; font-size: 26px"><span class="escribe">armemos algo juntos</span></p>
</div>
<a class="btn" href="https://wa.me/5491158165994" style="background: #071F24; color: #FFFFFF; font-weight: 600; padding: 16px 26px; border-radius: 999px; text-decoration: none">Escribime por WhatsApp</a>
</div>
</section>

<nav aria-label="Anterior y siguiente" style="border-top: 1px solid #164650; padding: 18px 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; font-weight: 600">
<a href="{{prevHref}}" style="color: #B9D6DB; text-decoration: none; padding: 12px 0">← {{prevTitulo}}</a>
<a href="{{nextHref}}" style="color: #FFFFFF; text-decoration: none; padding: 12px 0">{{nextTitulo}} →</a>
</div>
</nav>

<sc-if value="{{hayVisor}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="{{visor.titulo}}" style="position: fixed; inset: 0; z-index: 100; background: rgba(2,11,13,0.88); display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box">
<div class="abre" style="width: min(100%, 860px); max-height: 100%; overflow: auto; background: #0B2E35; border-radius: 22px; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<div style="aspect-ratio: {{ratio}}; max-height: 70vh; margin: 0 auto; width: 100%; border-radius: 14px; background: {{visor.fondo}}; display: flex; align-items: center; justify-content: center; color: #071F24; font-weight: 600; text-align: center; padding: 20px; box-sizing: border-box">[Acá va el video o la imagen de "{{visor.titulo}}"]</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: #FFFFFF">{{visor.titulo}}</span>
<span style="font-size: 14px; color: #B9D6DB">{{visor.meta}}</span>
</div>
<div style="display: flex; gap: 10px">
<a class="btn" href="{{visor.link}}" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 18px; border-radius: 999px; background: {{accent}}; color: #071F24; text-decoration: none; font-weight: 600">Ver en Behance</a>
<button type="button" onClick="{{cerrar}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #8FC3CB; background: transparent; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">Cerrar ✕</button>
</div>
</div>
</div>
</div>
</sc-if>
<div class="revela" aria-hidden="true" style="position: fixed; inset: 0; z-index: 300; pointer-events: none; background: {{accent}}"></div>
</div>
</template>
<script type="text/plain" id="dc-src" data-props='{"accent":{"editor":"color","default":"#B79CFF"},"$preview":{"width":1280,"height":1900}}'>
var BH = 'https://www.behance.net/gallery/246740539/Portfolio-Animation-2025';
var MUS = 'https://www.behance.net/gallery/254840235/Editor-de-Videos-y-Visualizers-Lisarts-Studios';
var DATA = {
num: '04', actual: 'MusicVisuals.dc.html',
titulo: 'Visualizers Musicales',
bajada: 'tu tema, con imagen propia',
desc: 'Identidad visual para lanzamientos musicales: visualizers, videoclips animados, covers y Spotify Canvas, trabajando directo con artistas y productores de principio a fin.',
tools: ['After Effects', 'Premiere Pro', 'Photoshop'],
ratio: '1 / 1', frameW: '280px',
trabajos: [
{ titulo: 'Sanxhezz', tag: 'VIDEO', meta: '2 videos · Trabajando actualmente', link: MUS },
{ titulo: 'MFLW', tag: 'VIDEO', meta: 'Video', link: MUS },
{ titulo: 'Chill Boy', tag: 'VIDEO', meta: 'Video', link: MUS },
{ titulo: 'LICHA', tag: 'VIDEO', meta: 'Video', link: MUS },
{ titulo: 'Elmesias', tag: 'EN PROCESO', meta: 'Trabajando actualmente', link: MUS },
{ titulo: 'Diego Smolovich', tag: 'EN PROCESO', meta: 'Trabajando actualmente', link: MUS }
],
stickers: [
{ big: '6', small: 'artistas', pos: 'right: 6%; top: 10px', cls: 's1' },
{ big: 'clip', small: 'animado en producción', pos: 'left: 4%; bottom: 40px', cls: 's2' }
],
servicios: ['Visualizers', 'Videoclips animados', 'Album covers animados', 'Spotify Canvas', 'Thumbnails de YouTube', 'Reels para artistas'],
cta: '¿Sacás un tema? Démosle imagen.',
prevHref: 'Edicion.dc.html', prevTitulo: 'Edición de video',
nextHref: 'Ilustracion.dc.html', nextTitulo: 'Ilustración y Storyboard'
};
var TABS = [['Animacion.dc.html', 'Animación', '#22C3D6'], ['Motion.dc.html', 'Motion', '#FFD23F'], ['Edicion.dc.html', 'Edición', '#FF7A5C'], ['MusicVisuals.dc.html', 'Visualizers', '#B79CFF'], ['Ilustracion.dc.html', 'Ilustración', '#5EE6A8']];
var FONDOS = ['#22C3D6', '#FFD23F', '#FF7A5C', '#B79CFF', '#5EE6A8'];
class Component extends DCLogic {
componentDidMount() { var self = this; this.onScroll = function (e) { var t = e && e.target && e.target.scrollTop; var y = Math.max(window.scrollY || 0, document.documentElement.scrollTop || 0, t || 0); var on = y > 30; if (on !== !!(self.state && self.state.bajo)) self.setState({ bajo: on }); }; window.addEventListener('scroll', this.onScroll, { passive: true }); document.addEventListener('scroll', this.onScroll, { passive: true, capture: true }); }
componentWillUnmount() { window.removeEventListener('scroll', this.onScroll); document.removeEventListener('scroll', this.onScroll, { capture: true }); }
renderVals() {
var self = this;
var st = this.state || {};
var accent = this.props.accent ?? '#B79CFF';
var d = DATA;
var letras = d.titulo.split('').map(function (c, i) { return { c: c === ' ' ? ' ' : c, i: i, color: '#FFFFFF' }; });
var tabs = TABS.map(function (t) {
var on = t[0] === d.actual;
return { href: t[0], label: t[1], estilo: 'text-decoration: none; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; font-weight: 600; ' + (on ? 'background: ' + t[2] + '; color: #071F24' : 'color: #B9D6DB') };
});
var base = d.trabajos.map(function (w, i) { return Object.assign({}, w, { fondo: FONDOS[(i + parseInt(d.num, 10) - 1) % FONDOS.length] }); });
var cuadros = [];
for (var k = 0; k < 4; k++) {
base.forEach(function (w, i) {
cuadros.push(Object.assign({}, w, { tab: k === 0 ? '0' : '-1', oculto: k === 0 ? 'false' : 'true', abrir: function () { self.setState({ sel: i }); } }));
});
}
var stickers = d.stickers.map(function (s, i) { return Object.assign({ bg: i % 2 ? '#F2F7F8' : '#FFD23F' }, s); });
var sel = st.sel;
var hay = typeof sel === 'number';
return {
barraFondo: st.bajo ? 'rgba(7,31,36,0.55)' : 'rgba(7,31,36,1)', barraBorde: st.bajo ? 'rgba(62,110,118,0.6)' : 'transparent',
accent: accent, num: d.num, titulo: d.titulo, bajada: d.bajada, desc: d.desc, tools: d.tools,
ratio: d.ratio, frameW: d.frameW, letras: letras, tabs: tabs, cuadros: cuadros, stickers: stickers,
servicios: d.servicios, cta: d.cta, prevHref: d.prevHref, prevTitulo: d.prevTitulo, nextHref: d.nextHref, nextTitulo: d.nextTitulo,
hayVisor: hay, visor: hay ? base[sel] : { titulo: '', meta: '', link: BH, fondo: accent },
cerrar: function () { self.setState({ sel: null }); }
};
}
}
</script>
<script src="morphdom.js"></script>
<script src="dc-lite.js"></script>
</body>
</html>
