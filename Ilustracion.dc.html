<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisarts Studios — Ilustración y Storyboard</title>
<meta name="description" content="Lisandro Martínez Mendoza · Lisarts Studios — Animación 2D/3D, Motion Graphics, Edición de video, Visualizers e Ilustración.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#071F24}
a{color:#5EE6A8}a:hover{color:#9FF2CB}
html{scroll-behavior:smooth}
@keyframes entrar{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.entra{animation:entrar .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.titulo-l{position:relative;display:block;width:max-content;max-width:100%;white-space:nowrap}
.boceto{color:transparent;-webkit-text-stroke:1.5px var(--c);animation:tiembla .5s steps(1,end) infinite}
@keyframes tiembla{0%{transform:translate(0,0)}25%{transform:translate(.6px,-.5px)}50%{transform:translate(-.5px,.4px)}75%{transform:translate(.4px,.6px)}}
.tinta{position:absolute;left:0;top:0;color:var(--c);clip-path:inset(0 100% 0 0);animation:entinta 1.1s cubic-bezier(.7,0,.2,1) forwards;animation-delay:var(--d)}
@keyframes entinta{to{clip-path:inset(0 -4% 0 0)}}
.punta{position:absolute;top:8%;bottom:8%;width:3px;border-radius:2px;background:#FFD23F;left:0;opacity:0;animation:punta 1.1s cubic-bezier(.7,0,.2,1) forwards;animation-delay:var(--d)}
@keyframes punta{0%{left:0;opacity:1}95%{opacity:1}100%{left:100%;opacity:0}}
.trazo{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:dibuja 7.5s ease-in-out infinite;animation-delay:var(--d)}
@keyframes dibuja{0%{stroke-dashoffset:var(--l)}22%,82%{stroke-dashoffset:0}92%,100%{stroke-dashoffset:var(--l)}}
.relleno{opacity:0;animation:rellena 7.5s ease-in-out infinite;animation-delay:var(--d)}
@keyframes rellena{0%,24%{opacity:0}34%,80%{opacity:1}90%,100%{opacity:0}}
@keyframes cuelga{0%,100%{transform:rotate(var(--r))}50%{transform:rotate(calc(var(--r) * -0.4))}}
.vineta{animation:cuelga 6s ease-in-out infinite;transform-origin:50% -10px}
.hoja{all:unset;box-sizing:border-box;cursor:zoom-in;display:block;width:100%;margin:0 0 22px;break-inside:avoid;position:relative;padding:8px 8px 34px;background:#F2F7F8;border-radius:3px;box-shadow:0 10px 24px rgba(0,0,0,.35);transform:rotate(var(--r));transition:transform .35s cubic-bezier(.3,1.5,.5,1),box-shadow .35s}
.hoja:hover,.hoja:focus-visible{transform:rotate(0) translateY(-6px) scale(1.03);box-shadow:0 22px 40px rgba(0,0,0,.45);z-index:2}
.hoja:focus-visible{outline:3px solid #5EE6A8;outline-offset:4px}
.hoja img{display:block;width:100%;height:auto;background:#0B2E35}
.hoja .cinta{position:absolute;top:-10px;left:50%;width:74px;height:22px;margin-left:-37px;background:rgba(94,230,168,.55);transform:rotate(calc(var(--r) * -2));box-shadow:0 1px 2px rgba(0,0,0,.15)}
.mesa{columns:4 220px;column-gap:26px}
@keyframes colorA{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes colorB{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.capa-color.pa{animation:colorA 1.4s cubic-bezier(.6,0,.2,1) .35s both}.capa-color.pb{animation:colorB 1.4s cubic-bezier(.6,0,.2,1) .35s both}
@keyframes lapizA{0%{left:0;opacity:1}96%{opacity:1}100%{left:100%;opacity:0}}
@keyframes lapizB{0%{left:0;opacity:1}96%{opacity:1}100%{left:100%;opacity:0}}
.lapiz-v{position:absolute;top:0;bottom:0;width:3px;background:#FFD23F;box-shadow:0 0 14px #FFD23F;opacity:0}.lapiz-v.pa{animation:lapizA 1.4s cubic-bezier(.6,0,.2,1) .35s both}.lapiz-v.pb{animation:lapizB 1.4s cubic-bezier(.6,0,.2,1) .35s both}
@keyframes abre{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.visor{animation:abre .3s ease-out both}
.btn{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.btn:hover,.btn:focus-visible{transform:translateY(-3px) rotate(-1.5deg)}
@keyframes cortina{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.cortina span{flex:1 1 0;background:#5EE6A8;transform-origin:0 50%;animation:cortina .6s cubic-bezier(.7,0,.2,1) both;animation-delay:calc(var(--i) * 70ms + .1s)}
@media (prefers-reduced-motion:reduce){.entra,.boceto,.trazo,.relleno,.vineta,.capa-color,.lapiz-v,.visor{animation:none}.trazo{stroke-dashoffset:0}.relleno{opacity:1}.tinta{animation:none;clip-path:none}.punta,.lapiz-v,.cortina{display:none}.hoja,.btn{transition:none}}
</style>

</head>

<rect class="relleno" style="--d: 1.4s" x="0" y="0" width="160" height="90" fill="#13285A"></rect>

</svg>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8FC3CB">ESC 1 · PM</span>
</div>
<div class="vineta" style="--r: -1deg; flex: 1 1 0; display: flex; flex-direction: column; gap: 4px">

<rect class="relleno" style="--d: 2.6s" x="0" y="0" width="160" height="90" fill="#13285A"></rect>

<path class="trazo" style="--l: 60; --d: 3s" d="M12 20 l4 4 M140 70 l4 -4 M146 16 l3 3" fill="none" stroke="#071F24" stroke-width="2"></path>
</svg>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8FC3CB">ESC 1 · PP</span>
</div>
</div>
<span style="font-family: Caveat, cursive; font-size: 24px; color: #5EE6A8; transform: rotate(-2deg)">plano general → medio → primer plano</span>
</div>
</section>

<section aria-label="Mesa de luz" style="max-width: 1200px; margin: 0 auto; padding: 24px 24px 16px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(36px, 5.4vw, 68px); line-height: 1; letter-spacing: -0.02em; color: #FFFFFF">La mesa de dibujo</h2>

</button>

<section aria-label="Stars in the City" style="max-width: 1200px; margin: 0 auto; padding: 40px 24px 16px">

<div style="display: flex; flex-wrap: wrap; gap: 14px 30px; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 640px">
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #164650; color: #FFD23F; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>PROYECTO EN DESARROLLO · VISTA PREVIA</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 3.4vw, 40px); font-weight: 700; color: #FFFFFF; line-height: 1.05">Stars in the City · dirección de arte</span>
<span style="font-size: 16px; line-height: 1.55; color: #B9D6DB">Biblia de preproducción de mi cortometraje de tesis: desarrollo visual, diseño de personajes, fondos y color. Muestro una selección; el documento completo lo comparto en una reunión.</span>
</div>
<a class="btn" href="https://wa.me/5491158165994" style="min-height: 48px; padding: 0 20px; border-radius: 999px; background: #FFD23F; color: #071F24; font-weight: 700; display: inline-flex; align-items: center; text-decoration: none">Pedir la biblia completa</a>

</div>
</section>

<section style="padding: 48px 24px 64px">

</div>
<div style="max-width: 1200px; margin: 28px auto 0; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between">
<a class="btn" href="MusicVisuals.dc.html" style="min-height: 48px; display: inline-flex; align-items: center; padding: 0 20px; border-radius: 999px; border: 1.5px solid #3E6E76; color: #FFFFFF; text-decoration: none; font-weight: 600">← Visualizers Musicales</a>

</div>
</template>
