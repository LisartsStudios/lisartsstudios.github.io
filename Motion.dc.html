<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisarts Studios — Motion Graphics</title>
<meta name="description" content="Lisandro Martínez Mendoza · Lisarts Studios — Animación 2D/3D, Motion Graphics, Edición de video, Visualizers e Ilustración.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#071F24}
a{color:#FFD23F}a:hover{color:#FFE48A}
html{scroll-behavior:smooth}
@keyframes pop{0%{opacity:0;transform:translateY(60%) scale(.4) rotate(-12deg)}70%{opacity:1;transform:translateY(-8%) scale(1.08) rotate(3deg)}100%{opacity:1;transform:none}}
.pl{display:inline-block;opacity:0;animation:pop .7s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:calc(var(--i) * 45ms + .1s)}
@keyframes barrido{0%,62%{transform:scaleX(0);transform-origin:0 50%}72%{transform:scaleX(1);transform-origin:0 50%}73%{transform:scaleX(1);transform-origin:100% 50%}86%,100%{transform:scaleX(0);transform-origin:100% 50%}}
.barrido{animation:barrido 4.5s cubic-bezier(.7,0,.2,1) infinite;animation-delay:1.4s}
@keyframes entrar{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.entra{animation:entrar .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes trim{0%{stroke-dashoffset:300}45%,55%{stroke-dashoffset:0}100%{stroke-dashoffset:-300}}
.trim{stroke-dasharray:300;animation:trim 3s cubic-bezier(.7,0,.3,1) infinite}
@keyframes giraCuad{0%,15%{transform:rotate(0) scale(1)}45%,60%{transform:rotate(90deg) scale(.6)}90%,100%{transform:rotate(180deg) scale(1)}}
.giraCuad{animation:giraCuad 2.4s cubic-bezier(.7,0,.3,1) infinite;animation-delay:var(--d)}
@keyframes rebota{0%,100%{transform:translateY(0)}40%{transform:translateY(-38px)}55%{transform:translateY(0)}65%{transform:translateY(-10px)}75%{transform:translateY(0)}}
.rebota{animation:rebota 1.8s cubic-bezier(.5,0,.5,1) infinite;animation-delay:var(--d)}
@keyframes cabezal{from{left:0}to{left:100%}}
.cabezal{animation:cabezal 3s linear infinite}
@keyframes deriva{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(30px,-40px) rotate(160deg)}}
.deriva{animation:deriva var(--dur) cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--d)}
@keyframes kf{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(45deg) scale(1.3)}}
.kf{animation:kf 1.4s ease-in-out infinite}
.capa{transition:background .2s ease}
.capa:hover,.capa:focus-visible{background:#123C44}
.capa:focus-visible{outline:3px solid #FFFFFF;outline-offset:-3px}
@keyframes crece{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.barra{transform-origin:0 50%;animation:crece .9s cubic-bezier(.7,0,.2,1) both;animation-delay:var(--d)}
@keyframes bota{0%,100%{translate:0 0}45%{translate:0 -8px}60%{translate:0 -5px}}
.bota{animation:bota 3.2s ease-in-out infinite}
.bota:nth-child(2n){animation-delay:-.8s}.bota:nth-child(3n){animation-delay:-1.7s}
@keyframes abrir{from{opacity:0;transform:scale(.94) translateY(20px)}to{opacity:1;transform:none}}
.abre{animation:abrir .45s cubic-bezier(.2,1.2,.4,1) both}
.btn{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.btn:hover,.btn:focus-visible{transform:translateY(-3px) rotate(-1.5deg)}
@keyframes revela{from{clip-path:circle(150% at 50% 50%)}to{clip-path:circle(0% at 50% 50%)}}
.revela{animation:revela .8s cubic-bezier(.7,0,.2,1) .1s both}
.grilla-scrub{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;align-items:start}
.scrub{all:unset;box-sizing:border-box;cursor:ew-resize;touch-action:pan-y;display:flex;flex-direction:column;border-radius:16px;background:#0B2E35;border:1.5px solid #164650;overflow:hidden;transition:transform .3s cubic-bezier(.3,1.6,.5,1),border-color .2s}
.scrub:hover,.scrub:focus-visible{transform:translateY(-4px);border-color:#FFD23F}
.scrub:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
.scrub.ancho{grid-column:span 2}
@media (max-width:520px){.scrub.ancho{grid-column:auto}}
.pantalla{position:relative;display:block;width:100%;background:#020B0D;overflow:hidden}
.cab{position:absolute;top:0;bottom:0;left:0;width:2px;background:#FF7A5C;box-shadow:0 0 0 1px rgba(7,31,36,.4);opacity:0;transition:opacity .2s;pointer-events:none}
.tc{position:absolute;right:8px;bottom:8px;padding:3px 8px;border-radius:6px;background:rgba(7,31,36,.85);color:#FFD23F;font-family:'JetBrains Mono',monospace;font-size:11px;opacity:0;transition:opacity .2s}
.scrub.activo .cab,.scrub.activo .tc{opacity:1}
.regla{position:relative;display:block;height:14px;background-color:#06191D;background-image:repeating-linear-gradient(90deg,#3E6E76 0 1px,transparent 1px 8%)}
.kfm{position:absolute;top:3px;width:8px;height:8px;margin-left:-4px;background:#FFD23F;transform:rotate(45deg);z-index:1}
.prog{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,122,92,.35)}
@media (prefers-reduced-motion:reduce){.pl{opacity:1;animation:none}.barrido,.entra,.trim,.giraCuad,.rebota,.cabezal,.deriva,.kf,.barra,.bota,.abre{animation:none}.scrub,.btn{transition:none}.revela{display:none}}
</style>

</head>
