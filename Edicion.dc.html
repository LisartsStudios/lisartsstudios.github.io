<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisarts Studios — Edición de video</title>
<meta name="description" content="Lisandro Martínez Mendoza · Lisarts Studios — Animación 2D/3D, Motion Graphics, Edición de video, Visualizers e Ilustración.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#071F24}
a{color:#FF7A5C}a:hover{color:#FFA48C}
html{scroll-behavior:smooth}
@keyframes entrar{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.entra{animation:entrar .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.linea2{display:block;white-space:nowrap;width:max-content;max-width:100%}
.trozo{display:inline-block;position:relative}
.clipx{display:inline-block;padding:0 .03em;border-radius:.08em;animation:armar 1.1s cubic-bezier(.5,1.6,.4,1) both;animation-delay:var(--d)}
@keyframes armar{0%{transform:translate(var(--fx),var(--fy));opacity:0;box-shadow:inset 0 0 0 .04em #FF7A5C;background:rgba(255,122,92,.14)}25%{opacity:1}70%{box-shadow:inset 0 0 0 .04em #FF7A5C;background:rgba(255,122,92,.14)}100%{transform:none;opacity:1;box-shadow:inset 0 0 0 .04em transparent;background:transparent}}
.trozo.corte{animation:ripple 6s cubic-bezier(.7,0,.2,1) infinite;animation-delay:var(--cd)}
@keyframes ripple{0%,6%{transform:none}12%,30%{transform:translateX(.22em)}38%,100%{transform:none}}
.trozo.corte::before{content:"";position:absolute;left:-.13em;top:8%;bottom:4%;width:.04em;min-width:2px;background:#FFFFFF;box-shadow:0 0 12px #FFFFFF;opacity:0;animation:navaja2 6s steps(1,end) infinite;animation-delay:var(--cd)}
@keyframes navaja2{0%,5%{opacity:0}6%,9%{opacity:1}10%,100%{opacity:0}}
.trozo.corte::after{content:"";position:absolute;left:-.2em;top:14%;bottom:10%;width:.16em;border-radius:3px;background:repeating-linear-gradient(135deg,rgba(255,122,92,.55) 0 4px,transparent 4px 8px);opacity:0;animation:hueco 6s cubic-bezier(.7,0,.2,1) infinite;animation-delay:var(--cd)}
@keyframes hueco{0%,10%{opacity:0}14%,28%{opacity:1}34%,100%{opacity:0}}
.linea{position:relative;display:block;width:max-content;max-width:100%;white-space:nowrap;padding:0 .04em}
.linea .txt{display:inline-block;clip-path:inset(0 100% 0 0);animation:revTxt .5s cubic-bezier(.7,0,.2,1) forwards;animation-delay:calc(var(--d) + .55s)}
.linea .bloque{position:absolute;left:0;right:0;top:12%;bottom:8%;border-radius:6px;transform-origin:100% 50%;animation:bloque 1.05s cubic-bezier(.7,0,.2,1) both;animation-delay:var(--d)}
@keyframes bloque{0%{transform:translateX(-105%) scaleX(1)}50%{transform:translateX(0) scaleX(1)}100%{transform:translateX(0) scaleX(0)}}
@keyframes revTxt{to{clip-path:inset(0 -5% 0 0)}}
.cabezal-h{position:absolute;top:2%;bottom:-2%;left:0;width:3px;background:#FF7A5C;opacity:0;pointer-events:none;animation:barrido 6s cubic-bezier(.45,0,.55,1) infinite;animation-delay:1.9s}
@keyframes barrido{0%{left:-2%;opacity:0}4%{opacity:1}36%{left:100%;opacity:1}40%,100%{left:100%;opacity:0}}
@keyframes salto{0%,38%{transform:none;color:inherit}39%{transform:translate(.06em,-.05em);color:#FF7A5C}46%{transform:translate(-.03em,.02em);color:inherit}47%,78%{transform:none}79%{transform:translate(-.05em,0);color:#FFD23F}84%,100%{transform:none;color:inherit}}
.mitad-d{animation:salto 3.2s steps(1,end) infinite;animation-delay:.9s}
@keyframes navaja{0%,30%{left:-4%;opacity:0}32%{opacity:1}40%{left:52%}46%{left:52%;opacity:1}52%,100%{left:52%;opacity:0}}
.navaja{animation:navaja 3.2s cubic-bezier(.7,0,.2,1) infinite;animation-delay:.9s}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.cl{opacity:0;animation:aparece .01s linear forwards;animation-delay:calc(var(--i) * 83ms + .5s)}
@keyframes corteImg{0%,16.66%{opacity:1}16.67%,100%{opacity:0}}
.toma{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:corteImg 6s steps(1,end) infinite;animation-delay:var(--d)}
@keyframes rec{0%,49%{opacity:1}50%,100%{opacity:.15}}
.rec{animation:rec 1s steps(1,end) infinite}
@keyframes beat{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.beat{transform-origin:50% 100%;animation:beat .9s cubic-bezier(.5,0,.5,1) infinite;animation-delay:var(--d)}
@keyframes corta{0%,35%{transform:translateX(0)}50%,100%{transform:translateX(10px)}}
.corta{animation:corta 2s cubic-bezier(.7,0,.2,1) infinite alternate}
@keyframes cuchilla{0%,20%{transform:translateY(-34px)}35%,60%{transform:translateY(0)}80%,100%{transform:translateY(-34px)}}
.cuchilla{animation:cuchilla 2s cubic-bezier(.7,0,.2,1) infinite alternate}
@keyframes rueda{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.rueda{animation:rueda var(--dur) linear infinite}
@keyframes bota{0%,100%{translate:0 0}45%{translate:0 -8px}60%{translate:0 -5px}}
.bota{animation:bota 3.2s ease-in-out infinite}
.bota:nth-child(2n){animation-delay:-.8s}.bota:nth-child(3n){animation-delay:-1.7s}
.btn{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.btn:hover,.btn:focus-visible{transform:translateY(-3px) rotate(-1.5deg)}
.bin{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 12px;border-radius:10px;transition:background .2s}
.bin:hover,.bin:focus-visible{background:#123C44}
.bin:focus-visible{outline:3px solid #FFFFFF;outline-offset:-3px}
.bin[aria-disabled="true"]{cursor:default;opacity:.55}
.bin[aria-disabled="true"]:hover{background:transparent}
#ed-cabezal .agarre:hover~.cabeza,#ed-cabezal.arrastrando .cabeza{transform:scale(1.25);transform-origin:50% 0}
.cabeza{transition:transform .15s}
.clip{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:block;height:64px;min-width:84px;border-radius:7px;overflow:hidden;background-color:#123C44;background-repeat:repeat-x;background-size:auto 100%;transition:filter .2s,transform .2s}
.clip:hover{filter:brightness(1.15)}
.clip:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
.onda{display:block;height:34px;min-width:84px;border-radius:6px;background-color:#0E3A33;background-image:repeating-linear-gradient(90deg,#5EE6A8 0 2px,transparent 2px 5px);-webkit-mask-image:linear-gradient(180deg,transparent 0 18%,#000 18% 82%,transparent 82%),repeating-linear-gradient(90deg,#000 0 30px,rgba(0,0,0,.5) 30px 44px);mask-image:linear-gradient(180deg,transparent 0 18%,#000 18% 82%,transparent 82%)}
@keyframes tira{from{transform:scaleY(1)}to{transform:scaleY(0)}}
.tiras span{flex:1 1 0;background:#FF7A5C;transform-origin:50% 0;animation:tira .55s cubic-bezier(.7,0,.2,1) both;animation-delay:calc(var(--i) * 60ms + .1s)}
@media (prefers-reduced-motion:reduce){.clipx,.trozo.corte{animation:none}.trozo.corte::before,.trozo.corte::after{display:none}.linea .txt{animation:none;clip-path:none}.linea .bloque,.cabezal-h{display:none}.entra,.mitad-d,.navaja,.rec,.beat,.corta,.cuchilla,.rueda,.bota{animation:none}.navaja{display:none}.cl{opacity:1;animation:none}.toma{animation:none}.toma:first-child{opacity:1}.btn,.clip,.bin{transition:none}.tiras{display:none}}
</style>

</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="font-family: Inter, system-ui, sans-serif; color: #E8F4F6; background: #071F24; position: relative; isolation: isolate; min-height: 100vh; overflow-x: clip">

<div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; pointer-events: none; background-image: linear-gradient(90deg, rgba(18,60,68,0.55) 1px, transparent 1px); background-size: 96px 100%"></div>

<div style="position: sticky; top: 0; z-index: 100; background: {{barraFondo}}; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid {{barraBorde}}; transition: background .3s ease, border-color .3s ease">
<header style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between">
<a href="Main.dc.html" class="btn" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #E8F4F6; color: #071F24; text-decoration: none; font-weight: 600; font-size: 14px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Volver al inicio</a>
<nav aria-label="Secciones" style="display: flex; flex-wrap: wrap; gap: 4px; font-size: 14px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><a href="{{t.href}}" style="{{t.estilo}}">{{t.label}}</a></sc-for>
</nav>
</header>
</div>

<section style="max-width: 1200px; margin: 0 auto; padding: 44px 24px 36px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<p class="entra" style="--d: 0s; margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; color: #8FC3CB">SECCIÓN 03 / 05 · SECUENCIA_01</p>
<h1 aria-label="Edición de video" style="position: relative; margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(54px, 9vw, 124px); line-height: 1; letter-spacing: -0.035em; color: #FFFFFF">
<span aria-hidden="true" class="linea2"><span class="trozo" style="--cd: 0s"><span class="clipx" style="--fx: 1.6em; --fy: -0.5em; --d: .15s">Edi</span></span><span class="trozo corte" style="--cd: 3.4s"><span class="clipx" style="--fx: -1.4em; --fy: 0.4em; --d: .3s">ción</span></span></span>
<span aria-hidden="true" class="linea2" style="color: #FF7A5C"><span class="trozo" style="--cd: 0s"><span class="clipx" style="--fx: 2.4em; --fy: 0.5em; --d: .45s">de</span></span><span class="trozo corte" style="--cd: 3.9s"><span class="clipx" style="--fx: -1.2em; --fy: -0.4em; --d: .6s">&nbsp;vi</span></span><span class="trozo corte" style="--cd: 4.2s"><span class="clipx" style="--fx: 0.8em; --fy: 0.6em; --d: .75s">deo</span></span></span>
<span aria-hidden="true" class="cabezal-h"><span style="position: absolute; top: -26px; left: 50%; transform: translateX(-50%); padding: 2px 7px; border-radius: 5px; background: #FF7A5C; color: #071F24; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0; white-space: nowrap">00:00:01:12</span></span>
</h1>
<p class="entra" style="--d: .9s; margin: 0; font-family: Caveat, cursive; font-size: 32px; color: #FFD23F; transform: rotate(-2deg); align-self: flex-start">ritmo, corte y una historia en segundos</p>
<p class="entra" style="--d: 1s; margin: 0; font-size: 18px; line-height: 1.55; color: #B9D6DB; max-width: 580px">Edito contenido para redes de marcas y clubes: reels verticales con ritmo, textos que acompañan el corte y piezas pensadas para que se vean hasta el final.</p>
<div class="entra" style="--d: 1.1s; display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="3"><span class="bota" style="padding: 9px 16px; border-radius: 999px; border: 1.5px solid #3E6E76; font-size: 14px; font-weight: 500">{{t}}</span></sc-for>
</div>
</div>
<div aria-hidden="true" style="flex: 1 1 260px; display: flex; justify-content: center">
<div style="position: relative; width: min(64vw, 250px); aspect-ratio: 9 / 16; border-radius: 26px; padding: 9px; background: #0B2E35; border: 1.5px solid #164650; box-shadow: 0 30px 60px rgba(0,0,0,0.35); transform: rotate(3deg)">
<div style="position: relative; width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: #020B0D">
<sc-for list="{{tomas}}" as="m" hint-placeholder-count="6"><img class="toma" src="{{m.src}}" alt="" style="--d: {{m.d}}"></sc-for>
<span style="position: absolute; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 6px; background: rgba(7,31,36,0.8); font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #FFFFFF"><span class="rec" style="width: 8px; height: 8px; border-radius: 50%; background: #FF7A5C"></span>REC</span>
<span style="position: absolute; right: 10px; top: 10px; padding: 4px 9px; border-radius: 6px; background: rgba(7,31,36,0.8); font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #FFD23F">9:16</span>
</div>
<span style="position: absolute; left: -46px; bottom: 34px; padding: 10px 14px; border-radius: 14px; background: #FF7A5C; color: #071F24; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; transform: rotate(-6deg); box-shadow: 0 10px 22px rgba(0,0,0,0.3)">✂ corte cada 1s</span>
</div>
</div>
</section>

<section aria-label="Sala de montaje" style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(36px, 5.4vw, 68px); line-height: 1; letter-spacing: -0.02em; color: #FFFFFF">Sala de montaje</h2>
<p style="margin: 0; font-family: Caveat, cursive; font-size: 26px; color: #FFD23F; transform: rotate(-2deg)">elegí una cuenta · arrastrá el cabezal o tocá un clip</p>
</div>

<div style="border-radius: 18px; background: #0B2E35; border: 1.5px solid #164650; overflow: hidden">
<div style="display: flex; flex-wrap: wrap">

<div role="group" aria-label="Cuentas" style="flex: 1 1 240px; min-width: 0; padding: 12px; box-sizing: border-box; background: #06191D; border-right: 1.5px solid #164650; display: flex; flex-direction: column; gap: 4px">
<span style="padding: 4px 12px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8FC3CB">PROYECTO · CUENTAS</span>
<sc-for list="{{bins}}" as="b" hint-placeholder-count="4">
<button type="button" class="bin" onClick="{{b.elegir}}" aria-pressed="{{b.on}}" aria-disabled="{{b.off}}" style="background: {{b.fondo}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="{{b.color}}" style="flex: 0 0 auto"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.4l2 2.2h8.6A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"></path></svg>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 600; font-size: 14px; color: #FFFFFF">{{b.n}}</span><span style="font-size: 12px; color: #8FC3CB">{{b.sub}}</span></span>
</button>
</sc-for>
</div>

<div style="flex: 999 1 520px; min-width: 0; padding: 18px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 22px; align-items: center; justify-content: center">
<div style="position: relative; width: min(100%, 300px); aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; background: #020B0D; border: 1.5px solid #164650">
<sc-if value="{{mon.esVideo}}" hint-placeholder-val="{{ true }}"><video id="ed-monitor" src="{{mon.video}}" poster="{{mon.poster}}" controls playsinline preload="metadata" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #020B0D"></video></sc-if>
<sc-if value="{{mon.esImg}}" hint-placeholder-val="{{ false }}"><img src="{{mon.img}}" alt="{{mon.titulo}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain"></sc-if>
<span style="position: absolute; left: 8px; top: 8px; padding: 3px 9px; border-radius: 6px; background: rgba(7,31,36,0.85); font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #FF7A5C; pointer-events: none">PROGRAMA</span>
</div>
<div style="flex: 1 1 220px; min-width: 0; max-width: 320px; display: flex; flex-direction: column; gap: 10px">
<span id="ed-tc" aria-hidden="true" style="font-family: 'JetBrains Mono', monospace; font-size: 26px; color: #FFD23F; letter-spacing: 0.04em">00:00:00:00</span>
<span style="align-self: flex-start; padding: 4px 11px; border-radius: 999px; background: {{mon.color}}; color: #071F24; font-size: 12px; font-weight: 700">{{mon.cuenta}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.1; color: #FFFFFF">{{mon.titulo}}</span>
<span style="font-size: 14px; color: #8FC3CB">{{mon.tipo}}</span>
<span style="font-size: 15px; line-height: 1.5; color: #B9D6DB">{{mon.desc}}</span>
<div style="display: flex; gap: 8px; padding-top: 4px">
<button type="button" class="btn" onClick="{{anterior}}" aria-label="Clip anterior" style="min-width: 48px; min-height: 48px; border-radius: 12px; border: 1.5px solid #3E6E76; background: transparent; color: #FFFFFF; font: inherit; font-size: 18px; cursor: pointer">⏮</button>
<button type="button" class="btn" onClick="{{reproducir}}" style="flex: 1 1 auto; min-height: 48px; padding: 0 18px; border-radius: 12px; border: none; background: #FF7A5C; color: #071F24; font: inherit; font-weight: 700; cursor: pointer">▶ Reproducir</button>
<button type="button" class="btn" onClick="{{siguiente}}" aria-label="Clip siguiente" style="min-width: 48px; min-height: 48px; border-radius: 12px; border: 1.5px solid #3E6E76; background: transparent; color: #FFFFFF; font: inherit; font-size: 18px; cursor: pointer">⏭</button>
</div>
</div>
</div>
</div>

<div style="border-top: 1.5px solid #164650; background: #06191D; overflow-x: auto">
<div style="min-width: 720px; padding: 10px 14px 14px; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 6px 8px; align-items: center">
<span></span>
<div id="ed-regla" aria-hidden="true" style="cursor: ew-resize; touch-action: none; user-select: none; -webkit-user-select: none; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8FC3CB; padding: 6px 0 4px; background-image: repeating-linear-gradient(90deg, #3E6E76 0 1px, transparent 1px 5%); background-size: 100% 6px; background-repeat: no-repeat; background-position: 0 100%"><span>00:00</span><span>{{secuenciaFin}}</span></div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #FF7A5C">V1</span>
<div id="ed-pista" style="position: relative; display: flex; gap: 3px">
<sc-for list="{{clips}}" as="c" hint-placeholder-count="6">
<button type="button" class="clip" id="{{c.id}}" onClick="{{c.ir}}" aria-label="Ver {{c.titulo}}" aria-current="{{c.actual}}" style="flex: {{c.peso}} 1 0; background-image: url({{c.tira}}); box-shadow: inset 0 0 0 {{c.borde}} #FF7A5C">
<span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 7px 5px; background: linear-gradient(180deg, transparent, rgba(2,11,13,0.92)); font-size: 11px; font-weight: 600; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left">{{c.titulo}}</span>
</button>
</sc-for>
<span id="ed-cabezal" aria-hidden="true" title="Arrastrá el cabezal" style="position: absolute; top: -26px; bottom: -48px; left: 0; width: 2px; background: #FF7A5C; z-index: 3; pointer-events: none"><span class="agarre" style="position: absolute; top: -6px; bottom: 0; left: -11px; width: 24px; cursor: ew-resize; pointer-events: auto; touch-action: none"></span><span class="cabeza" style="position: absolute; top: -2px; left: -9px; width: 20px; height: 18px; background: #FF7A5C; clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%); pointer-events: none"></span></span>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5EE6A8">A1</span>
<div aria-hidden="true" style="display: flex; gap: 3px">
<sc-for list="{{clips}}" as="c" hint-placeholder-count="6"><span class="onda" style="flex: {{c.peso}} 1 0; opacity: {{c.audio}}"></span></sc-for>
</div>
</div>
</div>
</div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 24px; display: flex; flex-direction: column; gap: 20px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 4vw, 44px); color: #FFFFFF">Cómo edito</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px">
<div style="padding: 22px; border-radius: 18px; background: #0B2E35; border: 1.5px solid #164650; display: flex; flex-direction: column; gap: 12px">
